name: OAS

on:
  push:
    branches:
      - master
      - stable/*
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  oas:
    name: Checks
    uses: maykinmedia/open-api-workflows/.github/workflows/oas.yml@31eaea25acd18bb681fe0d01b2452c3dd8d299b9 # v7.0.0
    with:
      python-version: '3.12'
      apt-packages: ''
      django-settings-module: selectielijst.conf.ci
      oas-generate-command: ./bin/generate_api_schema.sh
      schema-path: src/openapi.yaml
      oas-artifact-name: selectielijst-api-oas
      node-version-file: '.nvmrc'
      spectral-version: '^6.15.0'
      openapi-to-postman-version: '^5.0.0'
      postman-artifact-name: selectielijst-api-postman-collection
      openapi-generator-version: '^2.20.0'

# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
name: Code quality checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  open-api-workflow-code-quality:
    uses: maykinmedia/open-api-workflows/.github/workflows/code-quality.yml@776c60ffef1d34cbdee5a2402322cae6278ec237 # v7.0.1
    with:
      python-version: "3.12"
      node-version: "24"
      ruff-src-pattern: "src"
      django-settings-module: "selectielijst.conf.ci"
      django-secret-key: dummy

  


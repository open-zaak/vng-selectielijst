                $ref: '#/components/schemas/Fout'
          description: Conflict
        '410':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Gone
        '415':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Unsupported media type
        '429':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Too many requests
        '500':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: Internal server error
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    FieldValidationError:
      type: object
      description: Formaat van validatiefouten.
      properties:
        name:
          type: string
          description: Naam van het veld met ongeldige gegevens
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
        reason:
          type: string
          description: Uitleg wat er precies fout is met de gegevens
      required:
      - code
      - name
      - reason
    Fout:
      type: object
      description: Formaat van HTTP 4xx en 5xx fouten.
      properties:
        type:
          type: string
          description: URI referentie naar het type fout, bedoeld voor developers
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
        title:
          type: string
          description: Generieke titel voor het type fout
        status:
          type: integer
          description: De HTTP status code
        detail:
          type: string
          description: Extra informatie bij de fout, indien beschikbaar
        instance:
          type: string
          description: URI met referentie naar dit specifiek voorkomen van de fout.
            Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
      required:
      - code
      - detail
      - instance
      - status
      - title
    PaginatedResultaatList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Resultaat'
    ProcesType:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL-referentie naar dit object. Dit is de unieke identificatie
            en locatie van dit object.
        nummer:
          type: integer
          maximum: 32767
          minimum: 0
          title: Procestypenummer
          description: Nummer van de selectielijstcategorie
        jaar:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Het jaartal waartoe dit ProcesType behoort
        naam:
          type: string
          title: Procestypenaam
          description: Benaming van het procestype
          maxLength: 100
        omschrijving:
          type: string
          title: Procestypeomschrijving
          description: Omschrijving van het procestype
          maxLength: 300
        toelichting:
          type: string
          title: Procestypetoelichting
          description: Toelichting van het procestype
        procesobject:
          type: string
          description: Object waar de uitvoering van het proces op van toepassing
            is en waarvan de bestaans- of geldigheidsduur eventueel van belang is
            bij het bepalen van de start van de bewaartermijn
          maxLength: 80
      required:
      - jaar
      - naam
      - nummer
      - omschrijving
      - procesobject
      - toelichting
      - url
    ProcestermijnEnum:
      enum:
      - nihil
      - bestaansduur_procesobject
      - ingeschatte_bestaansduur_procesobject
      - vast_te_leggen_datum
      - samengevoegd_met_bewaartermijn
      type: string
    Resultaat:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL-referentie naar dit object. Dit is de unieke identificatie
            en locatie van dit object.
        procesType:
          type: string
          format: uri
          readOnly: true
        nummer:
          type: integer
          maximum: 32767
          minimum: 0
          description: Nummer van het resultaat. Dit wordt samengesteld met het procestype
            en generiek resultaat indien van toepassing.
        volledigNummer:
          type: string
          description: Calculate the complete number of the result.
          readOnly: true
        generiek:
          type: boolean
          readOnly: true
        specifiek:
          type: boolean
          readOnly: true
        naam:
          type: string
          description: Benaming van het procestype
          maxLength: 40
        omschrijving:
          type: string
          description: Omschrijving van het specifieke resultaat
          maxLength: 150
        herkomst:
          type: string
          description: 'Voorbeeld: ''Risicoanalyse'', ''Systeemanalyse'' of verwijzing
            naar Wet- en regelgeving'
          maxLength: 200
        waardering:
          $ref: '#/components/schemas/WaarderingEnum'
        procestermijn:
          description: |-
            Uitleg bij mogelijke waarden:

            * `nihil` - Nihil. Er is geen aparte procestermijn, de bewaartermijn start direct na de procesfase.
            * `bestaansduur_procesobject` - De bestaans- of geldigheidsduur van het procesobject. De lengte van de procestermijn is afhankelijk van het procesobject. Nadat het procesobject haar geldigheid heeft verloren of niet meer bestaat, gaat de bewaartermijn lopen.
            * `ingeschatte_bestaansduur_procesobject` - De ingeschatte maximale bestaans- of geldigheidsduur van het procesobject. Er wordt een inschatting gemaakt van de maximale bestaans- of geldigheidsduur van het procesobject, ongeacht de daadwerkelijke duur. Dit kan bijvoorbeeld al vastgelegd worden in het zaaktype, zodat procestermijn en bewaartermijn samen een bewaartermijn vormen die direct kan gaan lopen na de procesfase.
            * `vast_te_leggen_datum` - De tijdens het proces vast te leggen datum waarop de geldigheid van het procesobject komt te vervallen. Tijdens de procesuitvoering wordt de datum bepaald wanneer het procesobject zijn geldigheid zal verliezen en de procestermijn beëindigd wordt.
            * `samengevoegd_met_bewaartermijn` - De procestermijn is samengevoegd met de bewaartermijn. De procestermijn en bewaartermijn zijn samengevoegd als totaalwaarde bij de bewaartermijn. De datum waarop deze bewaartermijn moet gaan lopen is benoemd in de toelichting bij de categorie en kan ook in het verleden liggen, bijvoorbeeld op basis van een geboortedatum.
          oneOf:
          - $ref: '#/components/schemas/ProcestermijnEnum'
          - $ref: '#/components/schemas/BlankEnum'
        procestermijnWeergave:
          type: string
          readOnly: true
        bewaartermijn:
          type: string
          format: duration
          nullable: true
        toelichting:
          type: string
        algemeenBestuurEnInrichtingOrganisatie:
          type: boolean
        bedrijfsvoeringEnPersoneel:
          type: boolean
        publiekeInformatieEnRegistratie:
          type: boolean
        burgerzaken:
          type: boolean
        veiligheid:
          type: boolean
        verkeerEnVervoer:
          type: boolean
        economie:
          type: boolean
        onderwijs:
          type: boolean
        sportCultuurEnRecreatie:
          type: boolean
          title: Sport, cultuur en recreatie
        sociaalDomein:
          type: boolean
        volksgezonheidEnMilieu:
          type: boolean
        vhrosv:
          type: boolean
        heffenBelastingen:
          type: boolean
          title: Heffen belastingen etc.
        alleTaakgebieden:
          type: boolean
        procestermijnOpmerking:
          type: string
          description: 'Voorbeeld: ''25 jaar'', ''30 jaar, ''5 of 10 jaar'''
          maxLength: 20
      required:
      - generiek
      - herkomst
      - naam
      - nummer
      - procesType
      - procestermijnWeergave
      - specifiek
      - url
      - volledigNummer
      - waardering
    ResultaatTypeOmschrijvingGeneriek:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL-referentie naar dit object. Dit is de unieke identificatie
            en locatie van dit object.
        omschrijving:
          type: string
          description: Algemeen gehanteerde omschrijvingen van de aard van het resultaat
            van zaken
          maxLength: 20
        definitie:
          type: string
          description: Nauwkeurige beschrijving van het generieke type resultaat.
          maxLength: 255
        opmerking:
          type: string
          description: Zinvolle toelichting bij de waarde van de generieke omschrijving
            van het resultaat.
          maxLength: 255
      required:
      - definitie
      - omschrijving
      - url
    ValidatieFout:
      type: object
      description: Formaat van HTTP 4xx en 5xx fouten.
      properties:
        type:
          type: string
          description: URI referentie naar het type fout, bedoeld voor developers
        code:
          type: string
          description: Systeemcode die het type fout aangeeft
        title:
          type: string
          description: Generieke titel voor het type fout
        status:
          type: integer
          description: De HTTP status code
        detail:
          type: string
          description: Extra informatie bij de fout, indien beschikbaar
        instance:
          type: string
          description: URI met referentie naar dit specifiek voorkomen van de fout.
            Deze kan gebruikt worden in combinatie met server logs, bijvoorbeeld.
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
      required:
      - code
      - detail
      - instance
      - invalidParams
      - status
      - title
    WaarderingEnum:
      enum:
      - blijvend_bewaren
      - vernietigen
      type: string
servers:
- url: /api/v1
